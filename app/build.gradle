plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

def releaseStorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

android {
  signingConfigs {
    if (hasReleaseSigning) {
      release {
        storeFile file(releaseStorePath)
        storePassword releaseStorePassword
        keyAlias releaseKeyAlias
        keyPassword releaseKeyPassword
      }
    }
  }
  packagingOptions {
    jniLibs {
      useLegacyPackaging true
    }
  }
  splits {
    abi {
      enable true
      reset()
      //noinspection ChromeOsAbiSupport
      include "arm64-v8a", "x86_64"
      universalApk false
    }
  }

  defaultConfig {
    applicationId "com.leonidaslux.gifinone"
    minSdk 29
    targetSdk 34
    compileSdk 34
    versionCode 261102852
    versionName '26.1101.1852'
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    setProperty "archivesBaseName", "GIFinOne_${versionName}_${versionCode}"
  }

  buildTypes {
    release {
      if (hasReleaseSigning) {
        signingConfig signingConfigs.release
      }
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      debuggable false
    }
    debug {
      minifyEnabled false
      shrinkResources false
      debuggable true
    }
  }
  buildFeatures {
    viewBinding true
    buildConfig true
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = JavaVersion.VERSION_17.toString()
  }
  namespace 'com.leonidaslux.gifinone'
}

gradle.taskGraph.whenReady { taskGraph ->
  def buildingRelease = taskGraph.allTasks.any {
    it.project == project && it.name.toLowerCase().contains("release")
  }
  if (buildingRelease && !hasReleaseSigning) {
    throw new GradleException(
      "缺少 release 签名配置。请设置 ANDROID_KEYSTORE_PATH、ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS 和 ANDROID_KEY_PASSWORD。"
    )
  }
}

dependencies {

  // libgifsicle.so has been imported into the jniLibs directory.
  // It was cloned and compiled from https://github.com/kohler/gifsicle on January 9, 2024.

  // OutlineSpan.kt was cloned from https://github.com/santaevpavel/OutlineSpan on February 1, 2024.

  implementation 'androidx.core:core-ktx:1.13.0-rc01'
  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'androidx.draganddrop:draganddrop:1.0.0'
  implementation 'com.google.android.material:material:1.12.0-rc01'
  implementation 'com.github.bumptech.glide:glide:4.16.0'
  implementation "com.vanniktech:android-image-cropper:4.5.0"
  implementation 'com.arthenica:ffmpeg-kit-full-gpl:6.0-2'
  implementation 'com.tencent:mmkv:1.3.4'
  implementation 'androidx.work:work-runtime-ktx:2.9.0'

  annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

  testImplementation 'junit:junit:4.13.2'

  androidTestImplementation 'androidx.test.ext:junit:1.1.5'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
