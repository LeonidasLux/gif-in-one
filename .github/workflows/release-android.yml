name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 可选的 yy.MMdd.HHmm 版本号；留空则使用当前上海时间
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Releases must run from main."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build platform
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/gif-in-one-release.keystore"
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${secret_name}"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          chmod +x gradlew

      - name: Validate commit convention and generate release notes
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/*.py
          python3 scripts/generate_release_notes.py --to HEAD --check-only
          python3 scripts/generate_release_notes.py \
            --to HEAD \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Prepare Android version
        env:
          REQUESTED_VERSION: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          version_output="$(python3 scripts/prepare_release.py --version "$REQUESTED_VERSION")"
          version_name="$(printf '%s\n' "$version_output" | sed -n 's/^versionName=//p')"
          version_code="$(printf '%s\n' "$version_output" | sed -n 's/^versionCode=//p')"
          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "::error::Failed to prepare Android version."
            exit 1
          fi
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Run unit tests and build signed release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --console=plain

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          arm64_source="$(find app/build/outputs/apk/release -name '*-arm64-v8a-release.apk' -print -quit)"
          x86_source="$(find app/build/outputs/apk/release -name '*-x86_64-release.apk' -print -quit)"
          if [ -z "$arm64_source" ] || [ -z "$x86_source" ]; then
            echo "::error::Expected arm64-v8a and x86_64 release APKs were not produced."
            exit 1
          fi
          cp "$arm64_source" dist/gif-in-one-arm64-v8a.apk
          cp "$x86_source" dist/gif-in-one-x86_64.apk
          python3 scripts/create_update_manifest.py \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --arm64 dist/gif-in-one-arm64-v8a.apk \
            --x86-64 dist/gif-in-one-x86_64.apk \
            --output dist/update.json
          (
            cd dist
            sha256sum gif-in-one-arm64-v8a.apk > gif-in-one-arm64-v8a.apk.sha256
            sha256sum gif-in-one-x86_64.apk > gif-in-one-x86_64.apk.sha256
          )
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose dist/gif-in-one-arm64-v8a.apk
          "$apksigner" verify --verbose dist/gif-in-one-x86_64.apk

      - name: Commit version and create tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore(release): 更新版本号至 ${VERSION_NAME}"
          git tag "v${VERSION_NAME}"
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/v${VERSION_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION_NAME}" dist/* \
            --title "GIF in One v${VERSION_NAME}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest \
            --verify-tag
